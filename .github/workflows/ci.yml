name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        # Failing tests also become annotations, readable on the run's page
        # (and through the API) without signing in.
        run: |
          set -o pipefail
          if ! cargo test --color never 2>&1 | tee test.log; then
            grep -E "^test .* FAILED$|panicked at|^  left|^ right|assertion" test.log | head -40 |
              while IFS= read -r line; do echo "::error title=cargo test (${{ runner.os }})::$line"; done
            exit 1
          fi
